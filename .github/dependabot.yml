version: 2

updates:
  # NPM (your project)
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "develop"

    schedule:
      interval: "weekly"

    open-pull-requests-limit: 5

    # Ignore breaking changes (major versions)
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

    groups:
      npm-dependencies:
        patterns:
          - "*"

    labels:
      - "dependencies"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop"

    schedule:
      interval: "weekly"

    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

    labels:
      - "ci"
      - "dependencies"
